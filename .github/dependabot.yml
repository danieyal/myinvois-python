version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: "master"
    cooldown:
      default-days: 7
      semver-major-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: "master"
    cooldown:
      default-days: 7
